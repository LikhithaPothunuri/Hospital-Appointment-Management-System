<!DOCTYPE html>
<html>

<head>

    <title>Appointment Scheduling</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Appointment Scheduling</h1>

    <p>Schedule a hospital appointment</p>

</header>

<section class="hero">

    <h2>Book an Appointment</h2>

    <form>

        <p>
            <label>Patient Name:</label>

            <input type="text"
                   placeholder="Enter patient name">
        </p>

        <p>
            <label>Select Doctor:</label>

            <select>

                <option>
                    Dr. Anjali - Cardiologist
                </option>

                <option>
                    Dr. Rahul - Neurologist
                </option>

                <option>
                    Dr. Priya - Dermatologist
                </option>

            </select>
        </p>

        <p>
            <label>Appointment Date:</label>

            <input type="date">
        </p>

        <p>
            <label>Appointment Time:</label>

            <input type="time">
        </p>

        <button type="submit">
            Book Appointment
        </button>

    </form>

</section>

</body>
</html>
