<!DOCTYPE html>
<html>

<head>

    <title>Patient Registration</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Patient Registration</h1>

    <p>Register new hospital patients</p>

</header>

<section class="hero">

    <h2>Patient Registration Form</h2>

    <form>

        <p>
            <label>Patient Name:</label>
            <input type="text"
                   placeholder="Enter patient name">
        </p>

        <p>
            <label>Age:</label>
            <input type="number"
                   placeholder="Enter age">
        </p>

        <p>
            <label>Phone:</label>
            <input type="text"
                   placeholder="Enter phone number">
        </p>

        <p>
            <label>Gender:</label>

            <select>

                <option>Male</option>
                <option>Female</option>
                <option>Other</option>

            </select>

        </p>

        <button type="submit">
            Register Patient
        </button>
	<p>
    Patient registration helps maintain accurate
    hospital records.
</p>

    </form>

</section>

</body>
</html>
